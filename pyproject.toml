[project]
name = "StrokeGS"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
  "accelerate==1.14.0",
  "ipykernel==7.3.0",
  "ipywidgets==8.1.9",
  "matplotlib==3.11.0",
  "ninja==1.13.0",
  "numpy==2.5.1",
  "opencv-python==4.13.0.92",
  "pillow==12.3.0",
  "pyyaml==6.0.3",
  "torch==2.13.0",
  "torchmetrics==1.9.0",
  "torchvision==0.28.0",
  "tqdm==4.70.0",
  "transformers==5.12.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130" },
]
torchvision = [
  { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true